function toast(msg,ms=4200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),ms)}
function rateText(value){return `${Number(value||0).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}%`}
function statsRows(){const lane=$('#statsLane').value,q=$('#statsSearch').value.trim().toLocaleLowerCase(),laneNames=new Map(LANES.map(([key,label])=>[key,label])),grouped=new Map;Object.entries(state.pools).forEach(([key,list])=>{if(lane!=='all'&&lane!==key)return;list.forEach(hero=>{let row=grouped.get(hero.slug);if(!row){row={...hero,weight:0,banRate:0,positions:[]};grouped.set(hero.slug,row)}row.weight+=Number(hero.weight||0);row.banRate=Math.max(row.banRate,Number(hero.banRate||0));row.positions.push({key,label:laneNames.get(key),weight:Number(hero.weight||0)})})});let rows=[...grouped.values()];if(q)rows=rows.filter(x=>[x.name,x.championName,x.opggName,x.slug,x.alias,x.keywords].filter(Boolean).some(v=>String(v).toLocaleLowerCase().includes(q)));const field=statsState.sort,dir=statsState.dir;rows.sort((a,b)=>(Number(a[field])-Number(b[field]))*dir||a.name.localeCompare(b.name,'zh-CN'));return rows}
function renderStats(){const rows=statsRows();$('#statsCount').textContent=`${rows.length} 位英雄`;$('#statsBody').innerHTML=rows.length?rows.map((hero,i)=>`<tr><td class="rank-no">${i+1}</td><td><strong>${escapeHtml(hero.name)}</strong>${hero.championName&&hero.championName!==hero.name?`<span class="hero-en">${escapeHtml(hero.championName)}</span>`:''}<span class="hero-en">${escapeHtml(hero.alias||hero.slug)}</span></td><td><div class="lane-tags">${hero.positions.map(pos=>`<span class="lane-pill">${pos.label} ${rateText(pos.weight)}</span>`).join('')}</div></td><td class="num rate-pick">${rateText(hero.weight)}</td><td class="num rate-ban">${rateText(hero.banRate)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty-row">没有找到匹配的英雄</td></tr>';$$('.sort-btn').forEach(btn=>{const active=btn.dataset.sort===statsState.sort;btn.classList.toggle('active',active);btn.textContent=`${btn.dataset.sort==='weight'?'登场率合计':'禁用率'}${active?(statsState.dir<0?' ↓':' ↑'):''}`})}
function openStats(){renderStats();$('#statsModal').classList.remove('hidden');$('#statsSearch').focus()}
function closeStats(){$('#statsModal').classList.add('hidden')}
async function updateTencent(){const status=$('#dataStatus'),cached=status.textContent.startsWith('本机缓存'),opggLabel=`OPGG ${OPGG_SNAPSHOT.patch} Global · ${OPGG_SNAPSHOT.capturedAt}`;status.textContent='正在检查腾讯英雄资料…';try{const url='https://game.gtimg.cn/images/lol/act/img/js/heroList/hero_list.js';const res=await fetch(url,{mode:'cors',cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const catalog=await res.json();if(!Array.isArray(catalog.hero)||catalog.hero.length<150)throw new Error('英雄列表格式不正确');const byAlias=new Map(catalog.hero.map(h=>[String(h.alias||'').toLowerCase(),h]));let matched=0;const next=Object.fromEntries(Object.entries(state.pools).map(([lane,list])=>[lane,list.map(champ=>{const hero=byAlias.get(champ.slug.toLowerCase());if(!hero)return champ;matched++;const title=champ.opggName||champ.name;return{...champ,name:title,opggName:title,championName:hero.title||champ.championName||title,alias:hero.alias,keywords:hero.keywords,heroId:String(hero.heroId),image:`https://game.gtimg.cn/images/lol/act/img/champion/${encodeURIComponent(hero.alias)}.png`}})]));if(matched<140)throw new Error(`仅匹配到 ${matched} 个分路英雄，已取消更新`);const stamp=new Date().toLocaleString('zh-CN'),version=`${opggLabel} · 腾讯 ${catalog.version||'未知版本'}`,data={schema:CACHE_SCHEMA,source:'tencent',version,updatedAt:stamp,catalogCount:catalog.hero.length,pools:next};localStorage.setItem('lgg-roll-pools',JSON.stringify(data));state.pools=next;status.textContent=`已同步 · ${version}`}catch(e){status.textContent=cached?'本机缓存 · 腾讯数据暂时无法更新':`离线数据 · ${opggLabel}`;console.warn('腾讯英雄资料自动更新失败：',e.message)}}
function shanghaiDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
async function updateRemoteData(){const status=$('#dataStatus'),today=shanghaiDate(),checkKey='lgg-roll-remote-check-date',checkStamp=`${today}:${REMOTE_CHECK_REV}`;try{if(localStorage.getItem(checkKey)!==checkStamp){status.textContent='正在检查今日 OPGG 数据…';localStorage.setItem(checkKey,checkStamp);const res=await fetch(`${REMOTE_DATA_URL}?date=${today}&rev=${REMOTE_CHECK_REV}`,{mode:'cors',cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const remote=await res.json();if(remote?.source!=='OPGG'||remote?.generatorVersion<REMOTE_CHECK_REV||!remote?.capturedAt||!validPools(remote.pools))throw new Error('远端数据格式不正确');const currentDate=JSON.parse(localStorage.getItem('lgg-roll-pools')||'null')?.capturedAt||OPGG_SNAPSHOT.capturedAt;if(remote.capturedAt>=currentDate){state.pools=remote.pools;const version=`OPGG ${remote.patch||'未知版本'} Global · ${remote.capturedAt}`,data={schema:CACHE_SCHEMA,source:'remote',version,capturedAt:remote.capturedAt,updatedAt:new Date().toISOString(),pools:remote.pools};localStorage.setItem('lgg-roll-pools',JSON.stringify(data));status.textContent=`已获取今日数据 · ${version}`}}}catch(e){console.warn('OPGG 远端数据检查失败：',e.message);status.textContent='远端数据暂不可用，继续使用本机数据'}finally{await updateTencent()}}
$('#rollBtn').addEventListener('click',()=>{saveNames();roll()});$('#balanceBtn').addEventListener('click',balancePlayers);$('#revealBtn').addEventListener('click',revealAction);$('#againBtn').addEventListener('click',roll);$('#backBtn').addEventListener('click',back);$('#resetBtn').addEventListener('click',reset);$('#statsBtn').addEventListener('click',openStats);$('#statsClose').addEventListener('click',closeStats);$('#statsModal').addEventListener('click',e=>{if(e.target===$('#statsModal'))closeStats()});$('#statsSearch').addEventListener('input',renderStats);$('#statsLane').addEventListener('change',renderStats);$$('.sort-btn').forEach(btn=>btn.addEventListener('click',()=>{const field=btn.dataset.sort;if(statsState.sort===field)statsState.dir*=-1;else{statsState.sort=field;statsState.dir=-1}renderStats()}));$('#results').addEventListener('click',e=>{const btn=e.target.closest('[data-reroll]');if(btn)rerollHero(Number(btn.dataset.reroll))});$$('.cost-input').forEach(x=>x.addEventListener('input',updateCostTotals));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#statsModal').classList.contains('hidden')){closeStats();return}const onButton=e.target instanceof Element&&e.target.closest('button');if($('#arena').classList.contains('show')&&(e.code==='Space'||e.code==='Enter')&&!onButton&&$('#statsModal').classList.contains('hidden')){e.preventDefault();revealAction()}});updateRemoteData();
})();
</script>
